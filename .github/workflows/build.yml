name: Build

# Tests and builds on every push and pull request; a v* tag also publishes
# the builds as a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest images PySide6 supports, so the AppImages run on older
          # distributions too (x86_64 wheels need glibc 2.34, aarch64 2.39).
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-2025
          - target: windows-arm64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"

      # On Linux use Ubuntu's own Python: the one setup-python installs is
      # built without Bluetooth sockets, and the app could never connect.
      - name: Set up Python and system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip PySide6-Essentials pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build.py

      - uses: actions/upload-artifact@v7
        with:
          name: mebuds-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        run: |
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('mebuds/__init__.py').read()).group(1))")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
