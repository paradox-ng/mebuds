<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- App icon: the open case with both earbuds inside. -->
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f4f5"/>
      <stop offset="1" stop-color="#b3b5b9"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16171a"/>
      <stop offset="1" stop-color="#2c2e31"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8d92"/>
      <stop offset="0.5" stop-color="#5f6267"/>
      <stop offset="1" stop-color="#393b3f"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="0.2" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="bud" cx="0.38" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#c3c6ca"/>
      <stop offset="0.45" stop-color="#6a6d72"/>
      <stop offset="1" stop-color="#2e3033"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="117" rx="44" ry="5" fill="#000" opacity="0.22"/>
  <!-- open lid behind -->
  <path d="M14 58 C12 30 30 14 64 14 C98 14 116 30 114 58 Z" fill="url(#lid)"/>
  <path d="M20 58 C19 35 34 21 64 21 C94 21 109 35 108 58 Z" fill="url(#cavity)"/>
  <!-- earbuds -->
  <ellipse cx="44" cy="58" rx="20" ry="17" transform="rotate(-12 44 58)" fill="url(#bud)"/>
  <rect x="35" y="56" width="10" height="3.2" rx="1.6" transform="rotate(-30 40 57)"
        fill="#0c0c0d"/>
  <ellipse cx="84" cy="58" rx="20" ry="17" transform="rotate(12 84 58)" fill="url(#bud)"/>
  <rect x="83" y="56" width="10" height="3.2" rx="1.6" transform="rotate(30 88 57)"
        fill="#0c0c0d"/>
  <path d="M64 52 L69 62 H59 Z" fill="#d7d8da"/>
  <!-- case body -->
  <path d="M12 60 H116 V70 C116 96 95 113 64 113 C33 113 12 96 12 70 Z"
        fill="url(#body)"/>
  <path d="M12 60 H116 V70 C116 96 95 113 64 113 C33 113 12 96 12 70 Z"
        fill="url(#side)"/>
  <path d="M12 60 H116" stroke="#c9cbce" stroke-width="2.4"/>
  <rect x="53" y="91" width="22" height="3.4" rx="1.7" fill="#f5f5f5"/>
</svg>
